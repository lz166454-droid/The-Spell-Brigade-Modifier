name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify tag matches APP_VERSION
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v')) { throw "Tag must start with v, got: $tag" }
          $expected = $tag.Substring(1)
          $actual = python -c "from ui.paths import APP_VERSION; print(APP_VERSION)"
          if ($actual.Trim() -ne $expected) {
            throw "Tag $tag does not match APP_VERSION $actual (expected $expected)"
          }

      - name: Build onefile exe
        run: python build.py

      - name: Resolve release notes
        id: notes
        shell: pwsh
        run: |
          $path = Join-Path 'docs/releases' "$env:GITHUB_REF_NAME.md"
          if (Test-Path $path) {
            "exists=true" >> $env:GITHUB_OUTPUT
            "path=$path" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish Release (with notes file)
        if: steps.notes.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/*.exe
          fail_on_unmatched_files: true

      - name: Publish Release (generated notes)
        if: steps.notes.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.exe
          fail_on_unmatched_files: true
